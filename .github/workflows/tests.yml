name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5" # dias úteis, 06:00 em Manaus — detecta mudanças no site

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Rodar testes
        run: >
          pytest
          --browser ${{ matrix.browser }}
          --html=reports/report-${{ matrix.browser }}.html
          --junitxml=reports/junit-${{ matrix.browser }}.xml
          -n 4

      - name: Resumo no GitHub
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("reports/junit-${{ matrix.browser }}.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total, fail = int(s.get("tests")), int(s.get("failures")) + int(s.get("errors"))
          skip = int(s.get("skipped"))
          print(f"### ${{ matrix.browser }}")
          print(f"| Total | Passou | Falhou | Skip/xfail |\n|---|---|---|---|")
          print(f"| {total} | {total - fail - skip} | {fail} | {skip} |")
          EOF

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: reports/
          retention-days: 14

      - name: Publicar evidências de falha (screenshots, vídeos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
